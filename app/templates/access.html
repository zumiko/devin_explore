<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <title>AcmePay Internal Tools: access code</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main style="max-width: 440px; margin: 12vh auto;"><div class="panel" style="padding: 32px">
  <h1 class="brand" style="color: var(--ink); font-size: 20px; margin-bottom: 14px">AcmePay Internal Tools</h1>
  <p>This is a private demo with fake data. Enter the access code you were given.</p>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('access_gate') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <input name="code" type="password" autocomplete="current-password" autofocus required style="width: 100%">
    <button style="width: 100%; margin-top: 12px">Continue</button>
  </form>
</div></main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>AcmePay Internal Tools: access code</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main style="max-width: 420px; margin: 4rem auto;">
  <h1>AcmePay Internal Tools</h1>
  <p>This is a private demo with fake data. Enter the access code you were given.</p>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('access_gate') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <input name="code" type="password" autocomplete="current-password" autofocus required>
    <button>Continue</button>
  </form>
</main>
</body>
</html>

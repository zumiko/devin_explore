<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AcmePay{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.55 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased;
      background: radial-gradient(1200px 500px at 50% -120px, #dfe3ff 0%, rgba(223,227,255,0) 70%), #f4f6fb; min-height: 100vh; }
    header { padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; color: #0f172a; }
    .logo::before { content: ""; width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #7c7cff 0%, #5b5bf0 45%, #14b8a6 100%); }
    .demo { font-size: 12px; color: #64748b; background: #fff; border: 1px solid #e5e9f2; padding: 4px 10px; border-radius: 999px; }
    main { max-width: 560px; margin: 24px auto 48px; background: #fff; border: 1px solid #e5e9f2; border-radius: 18px; padding: 34px 36px; box-shadow: 0 20px 50px rgba(15,23,42,.08); }
    h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
    .sub { color: #64748b; margin: 0 0 22px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin: 14px 0 6px; }
    input, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #d5dbe7; border-radius: 10px; background: #fff; transition: border-color .15s, box-shadow .15s; }
    input:focus, textarea:focus { outline: none; border-color: #5b5bf0; box-shadow: 0 0 0 3px rgba(91,91,240,.15); }
    input[type="file"] { padding: 8px; background: #fff; }
    .row { display: flex; gap: 12px; } .row > div { flex: 1; }
    .photo { border: 1.5px dashed #c7cbe8; border-radius: 12px; padding: 14px 16px; margin-top: 14px; background: #f8f9ff; }
    .photo label { margin-top: 0; }
    .photo small { color: #64748b; display: block; margin-top: 6px; }
    button { margin-top: 24px; width: 100%; padding: 13px; font: inherit; font-weight: 700; color: #fff; background: linear-gradient(135deg, #6366f1, #4f46e5); border: 0; border-radius: 12px; cursor: pointer; box-shadow: 0 8px 20px rgba(79,70,229,.28); }
    button:hover { filter: brightness(1.05); }
    .error { background: #ffeef2; border: 1px solid #fecdd6; color: #9f1239; padding: 10px 14px; border-radius: 10px; }
    .result { text-align: center; padding: 12px 0; }
    .icon { font-size: 44px; width: 84px; height: 84px; line-height: 84px; border-radius: 50%; margin: 0 auto 16px; color: #fff; }
    .ok { background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 10px 24px rgba(5,150,105,.3); }
    .wait { background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 10px 24px rgba(217,119,6,.3); }
    .staff { margin-top: 26px; padding-top: 16px; border-top: 1px solid #eef1f7; font-size: 13px; color: #64748b; }
    a { color: #4338ca; }
  </style>
</head>
<body>
<header><span class="logo">AcmePay</span><span class="demo">Demo signup page &middot; fake data only</span></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>

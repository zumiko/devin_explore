<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AcmePay{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d2433; background: #eef2f8; }
    header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #dde3ec; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 800; font-size: 20px; color: #2f5bd3; }
    .demo { font-size: 12px; color: #889; }
    main { max-width: 560px; margin: 32px auto; background: #fff; border-radius: 12px; padding: 28px 32px; box-shadow: 0 2px 12px rgba(30,50,90,.08); }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .sub { color: #667; margin: 0 0 20px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    input { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid #ccd3df; border-radius: 6px; }
    .row { display: flex; gap: 12px; } .row > div { flex: 1; }
    .photo { border: 1px dashed #aab4c6; border-radius: 8px; padding: 12px; margin-top: 12px; background: #f8fafd; }
    .photo small { color: #778; display: block; margin-top: 4px; }
    button { margin-top: 22px; width: 100%; padding: 12px; font: inherit; font-weight: 700; color: #fff; background: #2f5bd3; border: 0; border-radius: 8px; cursor: pointer; }
    .error { background: #fdecea; border: 1px solid #f5b7b1; padding: 8px 12px; border-radius: 6px; }
    .result { text-align: center; padding: 12px 0; }
    .icon { font-size: 48px; width: 84px; height: 84px; line-height: 84px; border-radius: 50%; margin: 0 auto 12px; color: #fff; }
    .ok { background: #27ae60; } .wait { background: #f0ad4e; }
    textarea { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid #ccd3df; border-radius: 6px; }
    .staff { margin-top: 24px; padding-top: 14px; border-top: 1px solid #eee; font-size: 13px; color: #778; }
  </style>
</head>
<body>
<header><span class="logo">AcmePay</span><span class="demo">Demo signup page &middot; fake data only</span></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>

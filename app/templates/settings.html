{% extends 'base.html' %}
{% block content %}
<h1>Business rules</h1>
<p class="muted">These rules are stored as data, so changing them doesn't need a code change. Only admins can edit them.</p>
<form method="post" class="stack narrow">
  {% for r in rows %}
  <label>{{ r.description }}<input name="{{ r.key }}" value="{{ r.value }}" {% if not can('settings_edit') %}disabled{% endif %}><small class="mono">{{ r.key }}</small></label>
  {% endfor %}
  {% if can('settings_edit') %}<button>Save</button>{% endif %}
</form>
{% endblock %}

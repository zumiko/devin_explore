{% extends 'base.html' %}
{% block content %}
<h1>Customers</h1>
<form><input name="q" value="{{ q }}" placeholder="Search name, email or ID"> <button>Search</button></form>
<table>
  <tr><th>ID</th><th>Name</th><th>Email</th><th>State</th><th>Type</th><th>Status</th></tr>
  {% for c in customers %}
  <tr><td>{{ c.id }}</td><td><a href="{{ url_for('customer', customer_id=c.id) }}">{{ c.name }}</a></td><td>{{ c.email }}</td><td>{{ c.state }}</td><td>{{ c.account_type }}</td><td>{{ c.status|label }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
